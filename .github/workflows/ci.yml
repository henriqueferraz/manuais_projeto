name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci.txt

      - name: Ruff
        run: ruff check backend

      - name: Black
        run: black --check backend

      - name: Bandit
        run: bandit -q -r backend -x '*/tests/*,*/migrations/*,*/scripts_beta_s001.py,*/scripts_beta_s002.py'

      - name: pip-audit
        run: pip-audit -r requirements/base.txt

      - name: Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/backend:${PYTHONPATH}"
          pytest --cov=apps --cov-report=term-missing

      - name: Golden set (extração + RAG)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/backend:${PYTHONPATH}"
          python backend/manage.py run_golden_set --min-score 0.66
          python backend/manage.py run_rag_golden_set --min-score 0.66

      - name: Check migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/backend:${PYTHONPATH}"
          python backend/manage.py makemigrations --check --dry-run
