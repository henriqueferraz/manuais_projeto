{% extends "base.html" %}
{% block title %}Garantia digital — {{ brand_name }}{% endblock %}
{% block content %}
<section class="tp-section" style="max-width: 36rem">
  <h1 class="font-headline-lg">Garantia via QR</h1>
  <p class="tp-section__lead">
    Código {% if code.label %}<span class="font-technical">{{ code.label }}</span>{% else %}{{ code.id }}{% endif %}
    {% if code.sku %} · SKU {{ code.sku }}{% endif %}
  </p>

  <form method="post" class="d-flex flex-column gap-3">
    {% csrf_token %}
    <div>
      <label class="form-label" for="id_email">E-mail</label>
      <input id="id_email" name="email" type="email" class="form-control" required
        {% if user.is_authenticated %}value="{{ user.email }}"{% endif %} />
    </div>
    <div>
      <label class="form-label" for="id_title">Assunto</label>
      <input id="id_title" name="title" class="form-control" value="Garantia via QR" />
    </div>
    <div>
      <label class="form-label" for="id_description">Descreva o problema</label>
      <textarea id="id_description" name="description" class="form-control" rows="4" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary align-self-start">Abrir chamado</button>
  </form>
</section>
{% endblock %}
