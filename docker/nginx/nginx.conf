upstream django {
    server web:8000;
}

# Em staging/prod com TLS no proxy, espelhar estes headers no server :443.
# Compose local (HTTP :8080) usa HSTS curto só para validar a config.
map $http_x_forwarded_proto $hsts_value {
    default "";
    https   "max-age=3600; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Hardening headers (T-P.2)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security $hsts_value always;

    location /static/ {
        alias /static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /media/;
        expires 1d;
    }

    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
