services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: techparts
      POSTGRES_USER: techparts
      POSTGRES_PASSWORD: techparts
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techparts -d techparts"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      # Neon ou outro Postgres remoto: defina DATABASE_URL no .env
      # Default = Postgres do Compose (serviço db)
      DATABASE_URL: ${DATABASE_URL:-postgres://techparts:techparts@db:5432/techparts}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      USE_REDIS_CACHE: "true"
      CELERY_TASK_ALWAYS_EAGER: "false"
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "${WEB_PUBLISH_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--reload",
        "--workers",
        "2",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: ${DATABASE_URL:-postgres://techparts:techparts@db:5432/techparts}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info"]

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: ${DATABASE_URL:-postgres://techparts:techparts@db:5432/techparts}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: ${DATABASE_URL:-postgres://techparts:techparts@db:5432/techparts}
      CELERY_BROKER_URL: redis://redis:6379/1
      SECRET_KEY: flower-local-only
    ports:
      - "${FLOWER_PUBLISH_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
        required: false
    command: ["celery", "-A", "config", "flower", "--port=5555"]

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${NGINX_PUBLISH_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro
    depends_on:
      web:
        condition: service_healthy

  # Só sobe com: docker compose --profile clamav up -d clamav
  # (não sobe db/web). Host local: CLAMAV_HOST=127.0.0.1
  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:1.4
    ports:
      - "${CLAMAV_PUBLISH_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  pgdata:
  media_data:
  clamav_data:
